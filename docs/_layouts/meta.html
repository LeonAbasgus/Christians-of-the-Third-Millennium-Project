<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ page.title }} · CTM</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.canonical }}">
  <link rel="alternate" hreflang="en" href="https://leonabasgus.github.io/Christians-of-the-Third-Millennium-Project/en/">
  <link rel="alternate" hreflang="ru" href="https://leonabasgus.github.io/Christians-of-the-Third-Millennium-Project/ru/">
  <link rel="alternate" hreflang="de" href="https://leonabasgus.github.io/Christians-of-the-Third-Millennium-Project/de/">
  <link rel="alternate" hreflang="fr" href="https://leonabasgus.github.io/Christians-of-the-Third-Millennium-Project/fr/">
  <link rel="alternate" hreflang="el" href="https://leonabasgus.github.io/Christians-of-the-Third-Millennium-Project/el/">
  <link rel="alternate" hreflang="sr" href="https://leonabasgus.github.io/Christians-of-the-Third-Millennium-Project/sr/">
  <link rel="alternate" hreflang="x-default" href="https://leonabasgus.github.io/Christians-of-the-Third-Millennium-Project/en/">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"ScholarlyArticle",
    "headline":{{ page.title | jsonify }},
    "name":{{ page.title | jsonify }},
    "author":{"@type":"Person","name":"Leon Adzhindzhal / Hierodeacon Panteleimon"},
    "inLanguage":{{ page.lang | jsonify }},
    "version":"1.0",
    "isPartOf":{"@type":"CreativeWorkSeries","name":"To Christians of the Third Millennium (CTM)"},
    "url":{{ page.canonical | jsonify }},
    "description":{{ page.description | default: site.description | jsonify }},
    "license":"https://creativecommons.org/licenses/by/4.0/"
  }
  </script>
</head>
<body>
<header class="site-header">
  <div class="wrap topbar">
    <a class="brand" href="{{ '/' | relative_url }}">CTM / ХТТ</a>
    <nav aria-label="Primary"><a href="{{ '/corpus/' | relative_url }}">Corpus</a><a href="{{ '/about/' | relative_url }}">About</a></nav>
  </div>
  <div class="wrap languages" aria-label="Language versions">
    <a href="{{ '/en/' | relative_url }}">English</a><a href="{{ '/ru/' | relative_url }}">Русский</a><a href="{{ '/de/' | relative_url }}">Deutsch</a><a href="{{ '/fr/' | relative_url }}">Français</a><a href="{{ '/el/' | relative_url }}">Ελληνικά</a><a href="{{ '/sr/' | relative_url }}">Српски</a>
  </div>
</header>
<main class="wrap document">
{{ content }}
</main>
<footer class="wrap footer">Canonical Meta-Document v1.0 · CTM I–III · Leon Adzhindzhal / Hierodeacon Panteleimon</footer>
</body>
</html>
